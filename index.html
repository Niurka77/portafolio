<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niurka OS · Portafolio de Niurka Guevara</title>
<meta name="description" content="Bienvenido a mi escritorio. Explora mis proyectos, certificados y quién soy: Full Stack Developer y AI Engineer desde Chiclayo, Perú.">
<meta property="og:title" content="Niurka OS · Portafolio">
<meta property="og:description" content="Un escritorio explorable: proyectos reales, certificados y mi mundo.">
<meta name="theme-color" content="#3BA7E8">
<link rel="icon" href="logo.ico">
<style>
  :root {
    --pink: #F06292;
    --pink2: #F48FB1;
    --pink-soft: #FCE4EC;
    --mint: #66BB8A;
    --mint-soft: #E8F5EE;
    --sky: #42A5F5;
    --sky-soft: #E3F2FD;
    --lilac: #9575CD;
    --lilac-soft: #EDE7F6;
    --amber: #FFB74D;
    --amber-soft: #FFF3E0;
    --coral: #FF8A65;
    --ink: #263238;
    --ink-soft: #546E7A;
    --cream: #FAFBFC;
    --bg-step: #3BA7E8;
    --taskbar: linear-gradient(180deg,#F2F4F7,#DCE3EA);
    --win-gray: linear-gradient(180deg,#fff,#EFF2F5);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color:var(--ink);
    background:#1B6FB8;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    cursor:default;
  }
  ::selection { background:var(--sky); color:#fff; }

  /* Icono SVG reutilizable */
  .iw { width:1em; height:1em; display:inline-block; flex-shrink:0; vertical-align:-0.12em; }
  .iw svg { width:100%; height:100%; display:block; }

  /* ============ BOOT ============ */
  #boot {
    position:fixed; inset:0; z-index:10000;
    background:#1A5FA8;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; color:#fff; font-family:'Segoe UI', Tahoma, sans-serif;
    transition:opacity .55s ease, visibility .55s ease;
  }
  #boot.off { opacity:0; visibility:hidden; }
  #boot .logo {
    font-size:52px; font-weight:700; letter-spacing:2px;
    display:flex; align-items:center; gap:10px;
  }
  #boot .logo b { color:#9BE0FF; }
  #boot .tag { font-size:13px; color:#CBE7F7; letter-spacing:4px; }
  .win-progress { width:280px; height:18px; border:2px solid #fff8; box-shadow:0 0 0 3px #0002, inset 0 0 8px #0004; background:#0F3F70; border-radius:3px; overflow:hidden; position:relative; }
  .win-progress i { position:absolute; inset:0; width:0%; background:repeating-linear-gradient(90deg,#9BE0FF 0 12px,#42A5F5 12px 24px); transition:width .3s; }

  /* ============ DESKTOP ============ */
  #desktop {
    position:fixed; inset:0; display:flex; flex-direction:column;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(900px 400px at -10% 110%, rgba(255,255,255,.22), transparent 55%),
      linear-gradient(180deg,#4D9CE0 0%,#2E7FC6 40%,#2268A8 70%,#1A5A95 100%);
    overflow:hidden;
  }
  .wall-doodle { position:absolute; pointer-events:none; z-index:0; }
  #desktop::before, #desktop::after {
    content:"";
    position:absolute; pointer-events:none; border-radius:50%;
    filter:blur(2px);
  }
  #desktop::before { width:340px; height:340px; background:radial-gradient(circle,#fff3,transparent 70%); top:-90px; right:-60px; }
  #desktop::after { width:220px; height:220px; background:radial-gradient(circle,#fff2,transparent 70%); bottom:-40px; left:-60px; }

  /* Iconos escritorio */
  #icons {
    position:relative; z-index:2; padding:18px 14px; display:flex; flex-direction:column;
    align-items:center; gap:16px; width:96px; flex-shrink:0;
  }
  .d-icon {
    width:84px; padding:8px 4px 6px; border-radius:4px; text-align:center; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    border:1px solid transparent; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.45);
  }
  .d-icon:hover { background:rgba(60,120,180,.35); border-color:rgba(255,255,255,.6); }
  .d-icon:active { transform:scale(.96); }
  .d-icon .ico {
    width:52px; height:48px; display:flex; align-items:center; justify-content:center;
    font-size:30px; background:linear-gradient(180deg,#fff,#E9EEF4);
    border-radius:4px; box-shadow:inset -1px -2px 0 #C3CCD6, inset 1px 1px 0 #fff, 0 2px 4px rgba(0,0,0,.35);
    color:#6b4f63;
  }
  .d-icon span { font-size:11.5px; font-weight:600; line-height:1.15; }
  .d-icon.sel { background:rgba(10,40,80,.45); border-style:dashed; border-color:#fff; }

  /* ============ VENTANAS ============ */
  #windows { position:absolute; inset:0 0 0 0; z-index:5; pointer-events:none; }
  .win {
    position:absolute; pointer-events:auto; display:flex; flex-direction:column;
    background:var(--cream); border-radius:6px; min-width:300px; min-height:180px;
    box-shadow:0 0 0 1px var(--win-border,#C7D3E0), 0 14px 40px rgba(10,40,70,.45), 0 4px 10px rgba(10,40,70,.25);
    overflow:hidden;
  }
  .win.top { box-shadow:0 0 0 1px var(--win-border,#C7D3E0), 0 22px 55px rgba(10,30,60,.55), 0 6px 14px rgba(10,40,70,.3); }
  .win-bar {
    height:30px; display:flex; align-items:center; gap:8px; padding:0 8px 0 10px;
    background:var(--win-grad, #3BA7E8); cursor:grab; flex-shrink:0;
  }
  .win-bar:active { cursor:grabbing; }
  .win-bar .dot { width:2px; height:2px; border-radius:50%; background:transparent; }
  .win-bar .ttl { font-family:'Segoe UI', Tahoma, sans-serif; font-size:12px; font-weight:600; color:#fff; text-shadow:0 1px 1px rgba(0,0,0,.25); letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  .win-bar .ttl .iw { font-size:14px; vertical-align:-0.18em; }
  .win-btns { display:flex; gap:2px; }
  .win-btns button {
    width:20px; height:18px; font:700 10px/1 'Segoe UI', Tahoma, sans-serif; cursor:pointer;
    border:1px solid #fff8; background:rgba(255,255,255,.2); color:#fff;
    border-radius:2px;
  }
  .win-btns button:hover { background:#fff; color:var(--ink); }
  .win-body { flex:1; overflow:auto; padding:18px; background:var(--cream); }
  .win-body::-webkit-scrollbar { width:12px; }
  .win-body::-webkit-scrollbar-track { background:#EEF1F5; }
  .win-body::-webkit-scrollbar-thumb { background:#A9C7E4; border-radius:4px; }
  .win.minimized { display:none; }

  /* ============ BOTONERA / TASKBAR ============ */
  #taskbar {
    position:relative; z-index:50; height:46px; flex-shrink:0; margin-top:auto;
    background:var(--taskbar); border-top:1px solid #FFFFFF; box-shadow:0 -2px 10px rgba(10,40,70,.2);
    display:flex; align-items:center; gap:8px; padding:0 8px;
  }
  #start-btn {
    display:flex; align-items:center; gap:7px; height:32px; padding:0 14px 0 6px;
    font-family:'Segoe UI', Tahoma, sans-serif; font-weight:600; font-size:13px; color:var(--ink);
    background:linear-gradient(180deg,#fff,#E4E9F0); border:1px solid #C7D3E0;
    border-radius:3px; cursor:pointer; box-shadow:0 1px 3px rgba(10,40,70,.25);
  }
  #start-btn:hover { background:#fff; }
  #start-btn .fl { font-size:24px; color:var(--bg-step); }
  #tasks { display:flex; gap:6px; flex:1; overflow-x:auto; align-items:center; padding:0 4px; }
  #tasks::-webkit-scrollbar { height:6px; }
  #tasks::-webkit-scrollbar-thumb { background:#B9C8D8; border-radius:3px; }
  .task-b {
    height:30px; padding:0 12px; border-radius:3px; cursor:pointer; white-space:nowrap;
    font-size:11.5px; font-weight:600; color:#37474F; display:flex; align-items:center; gap:6px;
    background:linear-gradient(180deg,#fff,#E9EEF4); border:1px solid #C7D3E0; max-width:190px;
    box-shadow:0 1px 2px rgba(10,40,70,.15);
  }
  .task-b:hover { background:#F7F9FC; }
  .task-b.active { background:#CFE3F7; box-shadow:inset 0 1px 3px rgba(10,40,70,.25); }
  .task-b .iw { font-size:14px; }
  #clock {
    height:30px; padding:0 10px; display:flex; align-items:center; gap:6px;
    font-family:'Segoe UI', Tahoma, sans-serif; font-size:12px; color:#37474F; font-weight:600;
    background:linear-gradient(180deg,#fff,#E9EEF4); border:1px solid #C7D3E0; border-radius:3px;
    box-shadow:0 1px 2px rgba(10,40,70,.15);
  }
  #clock .iw { font-size:14px; color:#5E7A94; }

  /* ============ START MENU ============ */
  #start-menu {
    position:absolute; left:6px; bottom:52px; width:300px; z-index:60; display:none;
    background:var(--cream); border-radius:4px; overflow:hidden;
    box-shadow:0 0 0 1px #fff, 0 18px 50px rgba(10,40,70,.45);
  }
  #start-menu.open { display:block; animation:pop .16s ease; }
  @keyframes pop { from { transform:translateY(8px) scale(.98); opacity:0; } }
  #start-menu .sm-head {
    padding:12px 14px; color:#fff; font-family:'Segoe UI', Tahoma, sans-serif;
    background:linear-gradient(120deg,#3BA7E8,#1B6FB8);
  }
  #start-menu .sm-head b { display:block; font-size:16px; }
  #start-menu .sm-head span { font-size:11px; opacity:.9; }
  #start-menu .sm-item {
    display:flex; align-items:center; gap:12px; padding:10px 16px; cursor:pointer;
    font-size:13px; font-weight:600; color:var(--ink); border-left:3px solid transparent;
  }
  #start-menu .sm-item .fl { font-size:20px; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; color:#3D5A75; }
  #start-menu .sm-item:hover { background:#E3F2FD; border-left-color:var(--bg-step); }
  #start-menu .sm-sep { height:1px; background:#E4E9F0; margin:2px 0; }

  /* Layouts internos */
  .h1 { font-family:'Segoe UI', Tahoma, sans-serif; font-size:21px; color:var(--ink); margin-bottom:6px; display:flex; align-items:center; gap:10px; }
  .h1 .iw { font-size:24px; color:var(--bg-step); }
  .sub { color:var(--ink-soft); font-size:13px; margin-bottom:16px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .tags { display:flex; flex-wrap:wrap; gap:7px; }
  .tag {
    padding:4px 11px; border-radius:12px; font-size:11px; font-weight:700; border:1px solid #D6DEE8;
  }
  .tag.p { background:var(--pink-soft); color:#C2185B; }
  .tag.m { background:var(--mint-soft); color:#1B5E38; }
  .tag.s { background:var(--sky-soft); color:#1565C0; }
  .tag.l { background:var(--lilac-soft); color:#5E35B1; }
  .tag.a { background:var(--amber-soft); color:#B26A00; }

  /* Proyectos */
  .proj {
    background:#fff; border:1px solid #E0E6ED; border-radius:6px; margin-bottom:16px; overflow:hidden;
    box-shadow:0 2px 0 #E0E6ED; transition:transform .18s, box-shadow .18s;
  }
  .proj:hover { transform:translateY(-2px); box-shadow:0 4px 0 #E0E6ED, 0 10px 24px rgba(40,80,120,.12); }
  .proj-head { padding:14px 16px 4px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .proj-head h3 { font-family:'Segoe UI', Tahoma, sans-serif; font-size:16px; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .proj-head h3 .iw { font-size:20px; color:#3D5A75; }
  .proj-head .lbl { font-size:10px; font-weight:700; padding:3px 9px; border-radius:10px; color:#fff; }
  .proj .desc { padding:0 16px; }
  .proj p { font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:10px; }
  .proj .gal-wrap { position:relative; display:flex; align-items:center; }
  .proj .gal {
    flex:1; display:flex; gap:8px; overflow-x:auto; padding:4px 10px 14px; scroll-snap-type:x mandatory; cursor:grab;
  }
  .proj .gal:active { cursor:grabbing; }
  .proj .gal::-webkit-scrollbar { height:8px; }
  .proj .gal::-webkit-scrollbar-track { background:#EEF1F5; }
  .proj .gal::-webkit-scrollbar-thumb { background:#A9C7E4; border-radius:4px; }
  .proj .gal img {
    height:170px; border-radius:6px; cursor:zoom-in; scroll-snap-align:center; flex-shrink:0;
    border:1px solid #E0E6ED; box-shadow:0 2px 6px rgba(40,80,120,.12); background:#fff;
  }
  .proj .gal img:hover { transform:scale(1.02); }
  .proj .acts { padding:0 16px 14px; display:flex; gap:8px; flex-wrap:wrap; }
  .btn {
    display:inline-flex; align-items:center; gap:7px; padding:8px 15px; border-radius:4px;
    font-size:12px; font-weight:700; cursor:pointer; text-decoration:none; border:1px solid transparent;
    transition:filter .15s, transform .15s;
  }
  .btn .iw { font-size:14px; }
  .btn:hover { filter:brightness(.97); transform:translateY(-1px); }
  .btn.primary { background:linear-gradient(120deg,var(--pink),var(--pink2)); color:#fff; box-shadow:0 2px 8px rgba(240,98,146,.35); }
  .btn.ghost { background:#fff; border-color:#C7D3E0; color:#455A64; }
  .btn.int { background:linear-gradient(120deg,var(--sky),#64B5F6); color:#fff; box-shadow:0 2px 8px rgba(66,165,245,.35); }

  /* Game window embebido */
  .game-frame { flex:1; border:0; width:100%; height:100%; min-height:380px; background:#000; }

  /* Ventana Sobre mi */
  .about-grid { display:flex; gap:18px; flex-wrap:wrap; }
  .avatar {
    width:172px; height:172px; border-radius:6px; object-fit:cover; flex-shrink:0;
    border:4px solid #fff; box-shadow:0 0 0 2px var(--sky), 0 8px 22px rgba(40,80,120,.25);
  }
  .about-txt { flex:1; min-width:230px; }
  .stat-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .stat {
    flex:1; min-width:96px; background:#fff; border:1px solid #E0E6ED; border-radius:6px; padding:12px 10px; text-align:center;
  }
  .stat b { display:block; font-family:'Segoe UI', Tahoma, sans-serif; font-size:20px; color:var(--sky); }
  .stat span { font-size:10.5px; color:var(--ink-soft); font-weight:600; }
  .quote {
    margin-top:16px; font-family:'Segoe Print', 'Segoe UI', Tahoma, sans-serif; font-size:17px; color:#455A64;
    background:var(--amber-soft); border:1px dashed var(--amber); padding:12px 16px; border-radius:6px;
  }

  /* Skills */
  .skill { margin-bottom:12px; }
  .skill .lbl { display:flex; justify-content:space-between; font-size:12px; font-weight:700; margin-bottom:5px; }
  .skill .lbl b { color:var(--sky); }
  .bar { height:14px; background:#E4E9F0; border-radius:4px; overflow:hidden; box-shadow:inset 0 1px 3px #CBD5E0; }
  .bar i { display:block; height:100%; width:0; border-radius:4px; background:linear-gradient(90deg,var(--sky),var(--lilac)); transition:width 1.1s cubic-bezier(.2,.8,.2,1); }

  /* Certificados */
  .filter-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .chip {
    padding:5px 14px; border-radius:12px; font-size:11.5px; font-weight:700; cursor:pointer;
    background:#fff; border:1px solid #C7D3E0; color:#455A64; transition:all .15s;
  }
  .chip.on { background:var(--sky); border-color:var(--sky); color:#fff; }
  .cert-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:11px; }
  .cert {
    background:#fff; border:1px solid #E0E6ED; border-radius:6px; padding:12px 13px; cursor:pointer;
    display:flex; gap:11px; align-items:flex-start; transition:transform .15s, box-shadow .15s; text-decoration:none; color:inherit;
  }
  .cert:hover { transform:translateY(-2px); box-shadow:0 6px 14px rgba(40,80,120,.14); }
  .cert .cico {
    width:38px; height:38px; border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:22px; color:#fff;
  }
  .cert b { display:block; font-size:12.5px; color:var(--ink); line-height:1.3; }
  .cert span { font-size:10.5px; color:var(--ink-soft); }
  .doc-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .doc {
    flex:1; min-width:150px; display:flex; align-items:center; gap:10px; padding:11px 13px;
    background:#fff; border:1px solid #E0E6ED; border-radius:6px; text-decoration:none; color:inherit; font-size:12px; font-weight:700;
  }
  .doc:hover { box-shadow:0 5px 12px rgba(40,80,120,.14); }
  .doc .cico { width:34px; height:34px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff; flex-shrink:0; }

  /* Contacto */
  .cbtns { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .c-item { display:flex; align-items:center; gap:10px; font-size:12.5px; padding:10px 12px; background:#fff; border:1px solid #E0E6ED; border-radius:6px; text-decoration:none; color:var(--ink); min-width:200px; font-weight:600; }
  .c-item:hover { box-shadow:0 5px 12px rgba(40,80,120,.14); }
  .c-item .cico { width:34px; height:34px; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; }
  input,textarea {
    width:100%; font-family:'Segoe UI', Tahoma, sans-serif; font-size:13px; color:var(--ink);
    padding:10px 12px; border-radius:4px; border:1px solid #C7D3E0; background:#fff; margin-bottom:10px;
  }
  input:focus,textarea:focus { outline:2px solid var(--sky); border-color:var(--sky); }
  label { display:block; font-size:11.5px; font-weight:700; color:#455A64; margin-bottom:4px; }

  /* Lightbox */
  #lightbox {
    position:fixed; inset:0; z-index:9000; display:none; align-items:center; justify-content:center;
    background:rgba(8,30,55,.8); backdrop-filter:blur(6px); padding:30px;
  }
  #lightbox.open { display:flex; animation:lg .2s ease; }
  @keyframes lg { from { opacity:0; } }
  #lightbox img { max-width:94%; max-height:92vh; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  #lightbox .lb-close {
    position:absolute; top:22px; right:26px; width:42px; height:42px; border-radius:50%;
    background:#fff; color:var(--ink); font:700 20px/1 'Segoe UI', Tahoma, sans-serif; cursor:pointer; border:0;
  }
  #lightbox .lb-nav { position:absolute; width:44px; height:44px; border-radius:50%; background:#fff; color:var(--ink); font:700 18px/1 'Segoe UI', Tahoma, sans-serif; cursor:pointer; border:0; top:50%; transform:translateY(-50%); }
  #lightbox .lb-nav.prev { left:18px; } #lightbox .lb-nav.next { right:18px; }

  /* Toast */
  #toast {
    position:fixed; bottom:60px; right:16px; z-index:9500; display:none; align-items:center; gap:10px;
    background:#fff; border:1px solid var(--sky); border-radius:6px; padding:12px 16px;
    font-size:13px; font-weight:600; color:var(--ink); box-shadow:0 12px 30px rgba(10,40,70,.25);
  }
  #toast.show { display:flex; animation:lg .2s; }
  #toast .iw { font-size:16px; color:var(--bg-step); }

  /* Hint bar */
  #hint {
    position:fixed; bottom:58px; left:50%; transform:translateX(-50%); z-index:40;
    background:rgba(255,255,255,.85); border:1px solid #fff; color:#455A64; font-size:12px; font-weight:600;
    padding:7px 16px; border-radius:14px; backdrop-filter:blur(4px); white-space:nowrap;
    animation:blink-soft 3s ease-in-out infinite; pointer-events:none;
  }
  @keyframes blink-soft { 0%,100%{opacity:.95} 50%{opacity:.5} }

  /* Modal friendly */
  @media (max-width:700px) {
    #icons { flex-direction:row; flex-wrap:wrap; width:100%; height:auto; justify-content:center; }
    #desktop { overflow:auto; }
    #windows { position:fixed; }
    .win { max-width:100vw; }
    #hint { display:none; }
  }
</style>
</head>

function openWin(id) {
  if (DESK.wins[id]) { focusWin(id); return; }
  const cfg = WINCFG[id];
  const el = document.createElement('div');
  el.className = 'win';
  el.id = 'win-' + id;
  el.innerHTML = `
    <div class="win-bar">
      <span class="dot"></span>
      <span class="ttl">${svgIc(cfg.icon)} ${cfg.label} — Niurka OS</span>
      <div class="win-btns"><button title="Minimizar" onclick="event.stopPropagation();minWin('${id}')">_</button><button title="Cerrar" onclick="event.stopPropagation();closeWin('${id}')">X</button></div>
    </div>
    <div class="win-body">${WIN_TMPL[id]}</div>`;
  el.style.width = cfg.w + 'px';
  el.style.height = cfg.h + 'px';
  const freeX = Math.max(130, Math.min(vw2(), 240));
  el.style.left = (freeX + (Math.random()*40)) + 'px';
  el.style.top = (30 + (Math.random()*40)) + 'px';
  el.style.setProperty('--win-grad', cfg.grad);
  el.style.setProperty('--win-border', cfg.border);

  // tamaño responsive
  const vw = window.innerWidth, vh = window.innerHeight;
  if (vw < 900) { el.style.width = (vw - 20) + 'px'; el.style.left = '10px'; }
  if (vh < 640) { el.style.height = Math.min(cfg.h, vh - 120) + 'px'; el.style.top = '20px'; }

  document.getElementById('windows').appendChild(el);
  DESK.wins[id] = el;

  // taskbar
  const tb = document.createElement('button');
  tb.className = 'task-b'; tb.id = 'task-' + id; tb.dataset.win = id;
  tb.style.setProperty('--tc', cfgIconColor(id));
  tb.innerHTML = `<span>${svgIc(cfg.icon)} ${cfg.label}</span>`;
  tb.onclick = () => toggleTask(id);
  document.getElementById('tasks').appendChild(tb);

  focusWin(id);
  afterOpen(id, el);
}

function cfgIconColor(id){ const m={about:'#3BA7E8',projects:'#5C9AE0',games:'#42A5F5',certs:'#9575CD',skills:'#66BB8A',contact:'#FF8A65',help:'#78909C'}; return m[id]||'#999'; }

function afterOpen(id, el) {
  if (id === 'projects') buildProjGals();
  if (id === 'games') el.querySelector('.win-body').style.display='flex';
  if (id === 'skills') animateSkills(el);
  if (id === 'certs') buildCerts();
  makeDraggable(el, el.querySelector('.win-bar'), id);
}

function cap(s){ return WINCFG[s] ? WINCFG[s].label : s; }

function vw2(){ return window.innerWidth; }

function focusWin(id) {
  const el = DESK.wins[id]; if (!el) return;
  DESK.zTop++;
  el.style.zIndex = DESK.zTop;
  el.classList.add('top');
  Object.keys(DESK.wins).forEach(k => { if (k !== id) DESK.wins[k].classList.remove('top'); });
  document.querySelectorAll('.task-b').forEach(b => b.classList.toggle('active', b.dataset.win === id));
  // cerrar start menu
  document.getElementById('start-menu').classList.remove('open');
}

function minWin(id) {
  const el = DESK.wins[id]; if (!el) return;
  el.classList.add('minimized');
  const tb = document.getElementById('task-' + id); if (tb) tb.classList.remove('active');
}
function toggleTask(id) {
  const el = DESK.wins[id]; if (!el) return;
  if (el.classList.contains('minimized')) { el.classList.remove('minimized'); focusWin(id); }
  else if (el.classList.contains('top')) { el.classList.add('minimized'); const tb=document.getElementById('task-'+id); if(tb)tb.classList.remove('active'); }
  else focusWin(id);
}
function closeWin(id) {
  const el = DESK.wins[id]; if (!el) return;
  el.remove(); delete DESK.wins[id];
  const tb = document.getElementById('task-' + id); if (tb) tb.remove();
  if (id === 'games') toast(svgIc('game') + ' ¡Hasta la próxima!');
}

/* Drag */
function makeDraggable(el, bar, id) {
  let sx, sy, ox, oy, dragging = false;
  bar.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.win-btns')) return;
    focusWin(id);
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    ox = el.offsetLeft; oy = el.offsetTop;
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const nx = Math.max(0, Math.min(window.innerWidth - 60, ox + (e.clientX - sx)));
    const ny = Math.max(0, Math.min(window.innerHeight - 90, oy + (e.clientY - sy)));
    el.style.left = nx + 'px';
    el.style.top = ny + 'px';
  });
  bar.addEventListener('pointerup', () => { dragging = false; });
  bar.addEventListener('dblclick', (e) => { if (!e.target.closest('.win-btns')) minWin(id); });
}

function buildProjGals() {
  const init = { tf:'gal-tf', hc:'gal-hc', game:'gal-game', kiva:'gal-kiva', donk:'gal-donk', mecho:'gal-mecho' };
  Object.keys(init).forEach(k => {
    const el = document.getElementById(init[k]);
    if (!el || el.dataset.done) return;
    el.dataset.done = 1;
    el.innerHTML = GALERIES[k].map((src, i) => `<img src="${src}" alt="${k} ${i+1}" onclick="openProjGallery('${k}',${i})">`).join('');
    // drag-to-scroll
    let down=false, startX=0, sl=0;
    el.addEventListener('pointerdown', (e) => { down=true; startX=e.clientX; sl=el.scrollLeft; });
    el.addEventListener('pointermove', (e) => { if(down){ el.scrollLeft = sl - (e.clientX-startX); } });
    ['pointerup','pointerleave'].forEach(ev => el.addEventListener(ev, () => down=false));
  });
}
function openProjGallery(key, idx = 0) {
  if (!GALERIES[key]) return;
  lightboxStack = { imgs: GALERIES[key], idx };
  showLb(srcLb(lightboxStack.idx));
}
function srcLb(i){ return lightboxStack.imgs[i]; }
function showLb(src){ document.getElementById('lb-img').src = src; document.getElementById('lightbox').classList.add('open'); }
function closeLb(){ document.getElementById('lightbox').classList.remove('open'); }
function lbNav(d){ lightboxStack.idx = (lightboxStack.idx + d + lightboxStack.imgs.length) % lightboxStack.imgs.length; showLb(srcLb(lightboxStack.idx)); }
document.addEventListener('keydown', (e) => {
  const lb = document.getElementById('lightbox');
  if (lb.classList.contains('open')) { if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowLeft') lbNav(-1); if (e.key === 'ArrowRight') lbNav(1); }
});
document.getElementById('lightbox').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeLb(); });

/* ---------- Certificados ---------- */
const CERT = (window.PORTFOLIO_CERTS || {});
const ALLCERTS = [...(CERT.tec||[]).map(c=>({...c,cat:'tec'})), ...(CERT.tools||[]).map(c=>({...c,cat:'tools'})), ...(CERT.soft||[]).map(c=>({...c,cat:'soft'}))];
const CICO = { py:'linear-gradient(120deg,#F06292,#F48FB1)', 'C++':'linear-gradient(120deg,#5d6db4,#8a9be0)', AI:'linear-gradient(120deg,#9575CD,#b39ddb)', BE:'linear-gradient(120deg,#42A5F5,#64B5F6)', RH:'linear-gradient(120deg,#ef5350,#f48fb1)', NDG:'linear-gradient(120deg,#66BB8A,#9fe9ce)', GC:'linear-gradient(120deg,#FFB74D,#FFD54F)', Ci:'linear-gradient(120deg,#7c9cc4,#a9c2ec)', IoT:'linear-gradient(120deg,#FF8A65,#ffb073)', DB:'linear-gradient(120deg,#66BB8A,#aeeed8)', Ja:'linear-gradient(120deg,#FFB74D,#FFD54F)', XL:'linear-gradient(120deg,#66BB8A,#9fe9ce)', RS:'linear-gradient(120deg,#F48FB1,#ff9fc0)', EN:'linear-gradient(120deg,#4ba7d8,#7fc8ec)', WA:'linear-gradient(120deg,#9575CD,#d0b2ff)', LT:'linear-gradient(120deg,#42A5F5,#9fd0ff)', NM:'linear-gradient(120deg,#F06292,#ffb1c9)', B18:'linear-gradient(120deg,#1B6FB8,#3BA7E8)' };
function icCertName(c){ return { py:'python', 'C++':'cplus', AI:'chip', BE:'server', RH:'linux', NDG:'linux', GC:'globe', Ci:'code', IoT:'iot', DB:'db', Ja:'java', XL:'grid', RS:'people', EN:'flag-peru', WA:'video', LT:'doc', NM:'medal', B18:'flag' }[c.ico] || 'cert'; }
function buildCerts(filter = 'all') {
  const grid = document.getElementById('cert-grid');
  if (!grid) return;
  const list = ALLCERTS.filter(c => filter === 'all' || c.cat === filter);
  grid.innerHTML = list.map(c => `
    <a class="cert" href="${window.CERT_URL ? window.CERT_URL(c.id) : '#'}" target="_blank" rel="noopener">
      <span class="cico" style="background:${CICO[c.ico]||'linear-gradient(120deg,#F48FB1,#ff9fc0)'}">${svgIc(icCertName(c))}</span>
      <div><b>${c.name}</b><span>${c.meta || ''} · ${c.desc || ''}</span></div>
    </a>`).join('');
}
document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (chip) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    chip.classList.add('on');
    buildCerts(chip.dataset.cat);
  }
});

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ---------- Start menu ---------- */
document.getElementById('start-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('start-menu').classList.toggle('open');
});
document.querySelectorAll('#start-menu .sm-item[data-open]').forEach(item => {
  item.addEventListener('click', () => { document.getElementById('start-menu').classList.remove('open'); openWin(item.dataset.open); });
});
document.getElementById('sm-refresh').addEventListener('click', () => {
  document.getElementById('start-menu').classList.remove('open');
  Object.keys(DESK.wins).forEach(closeWin);
  renderDesktop();
  toast(svgIc('refresh') + ' Escritorio reiniciado');
});
document.addEventListener('click', (e) => {
  const sm = document.getElementById('start-menu');
  if (sm.classList.contains('open') && !sm.contains(e.target) && e.target.id !== 'start-btn') sm.classList.remove('open');
});

/* ---------- Reloj ---------- */
function tick() {
  const cl = document.getElementById('clock');
  if (cl) cl.textContent = new Date().toLocaleTimeString('es-PE', { hour:'2-digit', minute:'2-digit' });
}
/* reloj con fecha */
function tickFull(){
  const cl = document.getElementById('clock');
  if (cl) cl.textContent = new Date().toLocaleDateString('es-PE',{month:'short',day:'numeric'}) + '  ' + new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
}

/* ---------- Init ---------- */
boot();
tickFull();
setInterval(tickFull, 10000);
