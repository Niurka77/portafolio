<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niurka OS · Portafolio de Niurka Guevara</title>
<meta name="description" content="Bienvenido a mi escritorio. Explora mis proyectos, certificados y quién soy: Full Stack Developer y AI Engineer desde Chiclayo, Perú.">
<meta property="og:title" content="Niurka OS · Portafolio">
<meta property="og:description" content="Un escritorio explorable: proyectos reales, certificados y mi mundo.">
<meta name="theme-color" content="#FF9EC4">
<link rel="icon" href="logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Patrick+Hand&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #FF5E8E;
    --pink2: #FF82A9;
    --pink-soft: #FFE4EC;
    --mint: #7FD8BE;
    --mint-soft: #E4F7EF;
    --sky: #6FB7FF;
    --sky-soft: #E4F0FF;
    --lilac: #B48DFF;
    --lilac-soft: #F1E9FF;
    --amber: #FFC46B;
    --amber-soft: #FFF3DC;
    --coral: #FF8A6B;
    --ink: #3A2E3F;
    --ink-soft: #6E5F76;
    --cream: #FFF9F4;
    --bg-step: #d189b0;
    --taskbar: linear-gradient(180deg,#F9C8DE,#F39BC1);
    --win-gray: linear-gradient(180deg,#fff,#f3eef2);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    background:#cf8bb2;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    cursor:default;
  }
  ::selection { background:var(--pink2); color:#fff; }

  /* ============ BOOT ============ */
  #boot {
    position:fixed; inset:0; z-index:10000;
    background:linear-gradient(160deg,#2E0F35,#5B1F63 45%,#8E3B78);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; color:#fff; font-family:'Space Mono',monospace;
    transition:opacity .55s ease, visibility .55s ease;
  }
  #boot.off { opacity:0; visibility:hidden; }
  #boot .logo {
    font-family:'Fredoka',cursive; font-size:52px; font-weight:700; letter-spacing:2px;
    display:flex; align-items:center; gap:10px;
  }
  #boot .logo b { color:#7DE2B8; }
  #boot .tag { font-size:13px; color:#dfc4e6; letter-spacing:4px; }
  .win-progress { width:280px; height:18px; border:2px solid #fff8; box-shadow:0 0 0 3px #0002, inset 0 0 8px #0004; background:#2a0f33; border-radius:3px; overflow:hidden; position:relative; }
  .win-progress i { position:absolute; inset:0; width:0%; background:repeating-linear-gradient(90deg,#7DE2B8 0 12px,#53c79a 12px 24px); transition:width .3s; }

  /* ============ DESKTOP ============ */
  #desktop {
    position:fixed; inset:0; display:flex; flex-direction:column;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(900px 400px at -10% 110%, rgba(255,255,255,.35), transparent 55%),
      linear-gradient(180deg,#F7BFD8 0%,#E99CC2 40%,#D989B5 70%,#C87BA8 100%);
    overflow:hidden;
  }
  .wall-doodle { position:absolute; pointer-events:none; z-index:0; }
  #desktop::before, #desktop::after {
    content:"";
    position:absolute; pointer-events:none; border-radius:50%;
    filter:blur(2px);
  }
  #desktop::before { width:340px; height:340px; background:radial-gradient(circle,#fff8,transparent 70%); top:-90px; right:-60px; }
  #desktop::after { width:220px; height:220px; background:radial-gradient(circle,#fff5,transparent 70%); bottom:-40px; left:-60px; }

  /* Iconos escritorio */
  #icons {
    position:relative; z-index:2; padding:18px 14px; display:flex; flex-direction:column;
    align-items:center; gap:16px; width:96px; flex-shrink:0;
  }
  .d-icon {
    width:84px; padding:8px 4px 6px; border-radius:8px; text-align:center; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    border:1px solid transparent; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35);
  }
  .d-icon:hover { background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.35); }
  .d-icon:active { transform:scale(.96); }
  .d-icon .ico {
    width:52px; height:48px; display:flex; align-items:center; justify-content:center;
    font-size:30px; background:linear-gradient(180deg,#fff,#f3eef2);
    border-radius:8px; box-shadow:inset -1px -2px 0 #d8c8d2, inset 1px 1px 0 #fff, 0 2px 4px rgba(0,0,0,.28);
    color:#6b4f63;
  }
  .d-icon span { font-size:11.5px; font-weight:600; line-height:1.15; }
  .d-icon.sel { background:rgba(20,40,90,.35); border-style:dashed; border-color:#fff; }

  /* ============ VENTANAS ============ */
  #windows { position:absolute; inset:0 0 0 0; z-index:5; pointer-events:none; }
  .win {
    position:absolute; pointer-events:auto; display:flex; flex-direction:column;
    background:var(--cream); border-radius:10px; min-width:300px; min-height:180px;
    box-shadow:0 0 0 2px var(--win-border,#E3B7CE), 0 14px 40px rgba(80,20,60,.35), 0 4px 10px rgba(80,20,60,.2);
    overflow:hidden;
  }
  .win.top { box-shadow:0 0 0 2px var(--win-border,#E3B7CE), 0 22px 55px rgba(60,10,45,.45), 0 6px 14px rgba(80,20,60,.22); }
  .win-bar {
    height:34px; display:flex; align-items:center; gap:8px; padding:0 10px;
    background:var(--win-grad,pink); cursor:grab; flex-shrink:0;
  }
  .win-bar:active { cursor:grabbing; }
  .win-bar .dot { width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:inset -2px -2px 0 #0002 inset; }
  .win-bar .ttl { font-family:'Fredoka',cursive; font-size:13px; font-weight:600; color:#fff; text-shadow:0 1px 1px rgba(0,0,0,.2); letter-spacing:.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  .win-btns { display:flex; gap:5px; }
  .win-btns button {
    width:24px; height:22px; font:700 11px/1 'Space Mono',monospace; cursor:pointer;
    border:1px solid #fff; border-radius:5px; background:rgba(255,255,255,.25); color:#fff;
    box-shadow:inset 0 1px 0 #fff6; transition:background .15s;
  }
  .win-btns button:hover { background:rgba(255,255,255,.45); }
  .win-body { flex:1; overflow:auto; padding:18px; background:var(--cream); }
  .win-body::-webkit-scrollbar { width:12px; }
  .win-body::-webkit-scrollbar-track { background:#F6EAF1; border-radius:6px; }
  .win-body::-webkit-scrollbar-thumb { background:var(--pink2); border-radius:6px; border:2px solid #F6EAF1; }
  .win.minimized { display:none; }

  /* ============ BOTONERA / TASKBAR ============ */
  #taskbar {
    position:relative; z-index:50; height:46px; flex-shrink:0; margin-top:auto;
    background:var(--taskbar); border-top:2px solid #fff; box-shadow:0 -2px 10px rgba(80,20,60,.18);
    display:flex; align-items:center; gap:8px; padding:0 8px;
  }
  #start-btn {
    display:flex; align-items:center; gap:7px; height:32px; padding:0 14px 0 8px;
    font-family:'Fredoka',cursive; font-weight:700; font-size:13px; color:var(--ink);
    background:linear-gradient(180deg,#fff,#F2D9EA); border:1px solid #fff;
    border-radius:8px; cursor:pointer; box-shadow:0 1px 4px rgba(60,10,40,.25);
  }
  #start-btn:hover { filter:brightness(1.02); }
  #start-btn img, #start-btn .fl { width:22px; height:22px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
  #tasks { display:flex; gap:6px; flex:1; overflow-x:auto; align-items:center; }
  #tasks::-webkit-scrollbar { height:6px; }
  #tasks::-webkit-scrollbar-thumb { background:#db9cc0; border-radius:3px; }
  .task-b {
    height:30px; padding:0 12px; border-radius:7px; cursor:pointer; white-space:nowrap;
    font-size:11.5px; font-weight:600; color:#5c4260; display:flex; align-items:center; gap:6px;
    background:linear-gradient(180deg,#fff,-10%,#f8ecf3); border:1px solid #fff; max-width:180px;
    box-shadow:0 1px 3px rgba(60,10,40,.18);
  }
  .task-b:hover { filter:brightness(.98); }
  .task-b.active { background:linear-gradient(180deg,#F2D3E6,#Eebee0); box-shadow:inset 0 1px 3px rgba(60,10,40,.3); }
  .task-b::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--tc,#ccc); flex-shrink:0; }
  .task-b.playing::before { animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  #clock {
    height:30px; padding:0 10px; display:flex; align-items:center; gap:8px;
    font-family:'Space Mono',monospace; font-size:12px; color:#5c4260; font-weight:700;
    background:linear-gradient(180deg,#fff,#f6ecf2); border:1px solid #fff; border-radius:7px;
    box-shadow:0 1px 3px rgba(60,10,40,.18);
  }

  /* ============ START MENU ============ */
  #start-menu {
    position:absolute; left:8px; bottom:52px; width:300px; z-index:60; display:none;
    background:var(--cream); border-radius:12px; overflow:hidden;
    box-shadow:0 0 0 2px #fff, 0 18px 50px rgba(60,10,45,.4);
  }
  #start-menu.open { display:block; animation:pop .16s ease; }
  @keyframes pop { from { transform:translateY(8px) scale(.98); opacity:0; } }
  #start-menu .sm-head {
    padding:14px 14px 12px; color:#fff; font-family:'Fredoka',cursive;
    background:linear-gradient(120deg,#FF5E8E,#B48DFF);
  }
  #start-menu .sm-head b { display:block; font-size:18px; }
  #start-menu .sm-head span { font-size:11px; opacity:.9; font-family:'Quicksand',sans-serif; }
  #start-menu .sm-item {
    display:flex; align-items:center; gap:12px; padding:11px 16px; cursor:pointer;
    font-size:13px; font-weight:600; color:var(--ink); border-left:0 solid transparent;
  }
  #start-menu .sm-item .fl { width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:19px; }
  #start-menu .sm-item:hover { background:linear-gradient(90deg,var(--pink-soft),#fff); border-left:4px solid var(--pink); }
  #start-menu .sm-sep { height:1px; background:#eedde8; margin:2px 0; }

  /* Layouts internos */
  .h1 { font-family:'Fredoka',cursive; font-size:22px; color:var(--ink); margin-bottom:6px; }
  .sub { color:var(--ink-soft); font-size:13px; margin-bottom:16px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .tags { display:flex; flex-wrap:wrap; gap:7px; }
  .tag {
    padding:4px 11px; border-radius:20px; font-size:11px; font-weight:700; border:1px solid #e7c8d6;
  }
  .tag.p { background:var(--pink-soft); color:#c23a68; }
  .tag.m { background:var(--mint-soft); color:#238d67; }
  .tag.s { background:var(--sky-soft); color:#2a6fb8; }
  .tag.l { background:var(--lilac-soft); color:#6f43b5; }
  .tag.a { background:var(--amber-soft); color:#b2761b; }

  /* Proyectos */
  .proj {
    background:#fff; border:1px solid #F0DBE7; border-radius:12px; margin-bottom:16px; overflow:hidden;
    box-shadow:0 3px 0 #F0DBE7; transition:transform .18s, box-shadow .18s;
  }
  .proj:hover { transform:translateY(-2px); box-shadow:0 6px 0 #F0DBE7, 0 10px 24px rgba(150,50,110,.12); }
  .proj-head { padding:14px 16px 4px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .proj-head h3 { font-family:'Fredoka',cursive; font-size:16px; color:var(--ink); }
  .proj-head .lbl { font-size:10px; font-weight:700; padding:3px 9px; border-radius:12px; color:#fff; }
  .proj.desc { padding:0 16px; }
  .proj .desc { padding:0 16px; }
  .proj p { font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:10px; }
  .proj .gal-wrap { position:relative; display:flex; align-items:center; }
  .proj .gal {
    flex:1; display:flex; gap:8px; overflow-x:auto; padding:4px 10px 14px; scroll-snap-type:x mandatory; cursor:grab;
  }
  .proj .gal:active { cursor:grabbing; }
  .proj .gal::-webkit-scrollbar { height:8px; }
  .proj .gal::-webkit-scrollbar-track { background:#F6EAF1; border-radius:4px; }
  .proj .gal::-webkit-scrollbar-thumb { background:var(--pink2); border-radius:4px; }
  .proj .gal img {
    height:170px; border-radius:10px; cursor:zoom-in; scroll-snap-align:center; flex-shrink:0;
    border:1px solid #eed8e4; box-shadow:0 2px 6px rgba(150,50,110,.12); background:#fff;
  }
  .proj .gal img:hover { transform:scale(1.02); }
  .proj .acts { padding:0 16px 14px; display:flex; gap:8px; flex-wrap:wrap; }
  .btn {
    display:inline-flex; align-items:center; gap:7px; padding:8px 15px; border-radius:9px;
    font-size:12px; font-weight:700; cursor:pointer; text-decoration:none; border:1px solid transparent;
    transition:filter .15s, transform .15s;
  }
  .btn:hover { filter:brightness(.97); transform:translateY(-1px); }
  .btn.primary { background:linear-gradient(120deg,var(--pink),var(--pink2)); color:#fff; box-shadow:0 2px 8px rgba(255,94,142,.35); }
  .btn.ghost { background:#fff; border-color:#E9CCDA; color:#8a4a6e; }
  .btn.int { background:linear-gradient(120deg,var(--sky),#8fc9ff); color:#fff; box-shadow:0 2px 8px rgba(111,183,255,.35); }

  /* Game window embebido */
  .game-frame { flex:1; border:0; width:100%; height:100%; min-height:380px; background:#000; border-radius:0; }

  /* Ventana Sobre mi */
  .about-grid { display:flex; gap:18px; flex-wrap:wrap; }
  .avatar {
    width:172px; height:172px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border:5px solid #fff; box-shadow:0 0 0 3px var(--pink2), 0 8px 22px rgba(150,50,110,.25);
  }
  .about-txt { flex:1; min-width:230px; }
  .stat-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .stat {
    flex:1; min-width:96px; background:#fff; border:1px solid #F0DBE7; border-radius:12px; padding:12px 10px; text-align:center;
  }
  .stat b { display:block; font-family:'Fredoka',cursive; font-size:20px; color:var(--pink); }
  .stat span { font-size:10.5px; color:var(--ink-soft); font-weight:600; }
  .quote {
    margin-top:16px; font-family:'Patrick Hand',cursive; font-size:18px; color:#8a4a6e;
    background:var(--amber-soft); border:1px dashed var(--amber); padding:12px 16px; border-radius:10px; transform:rotate(-.4deg);
  }

  /* Skills */
  .skill { margin-bottom:12px; }
  .skill .lbl { display:flex; justify-content:space-between; font-size:12px; font-weight:700; margin-bottom:5px; }
  .skill .lbl b { color:var(--pink); }
  .bar { height:14px; background:#F1E5EC; border-radius:8px; overflow:hidden; box-shadow:inset 0 1px 3px #dfc8d6; }
  .bar i { display:block; height:100%; width:0; border-radius:8px; background:linear-gradient(90deg,var(--pink),var(--lilac)); transition:width 1.1s cubic-bezier(.2,.8,.2,1); }

  /* Certificados */
  .filter-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .chip {
    padding:5px 14px; border-radius:20px; font-size:11.5px; font-weight:700; cursor:pointer;
    background:#fff; border:1px solid #E9CCDA; color:#8a4a6e; transition:all .15s;
  }
  .chip.on { background:var(--pink); border-color:var(--pink); color:#fff; }
  .cert-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:11px; }
  .cert {
    background:#fff; border:1px solid #F0DBE7; border-radius:12px; padding:12px 13px; cursor:pointer;
    display:flex; gap:11px; align-items:flex-start; transition:transform .15s, box-shadow .15s; text-decoration:none; color:inherit;
  }
  .cert:hover { transform:translateY(-2px); box-shadow:0 6px 14px rgba(150,50,110,.14); }
  .cert .cico {
    width:38px; height:38px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:19px; color:#fff;
  }
  .cert b { display:block; font-size:12.5px; color:var(--ink); line-height:1.3; }
  .cert span { font-size:10.5px; color:var(--ink-soft); }
  .doc-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .doc {
    flex:1; min-width:150px; display:flex; align-items:center; gap:10px; padding:11px 13px;
    background:#fff; border:1px solid #F0DBE7; border-radius:12px; text-decoration:none; color:inherit; font-size:12px; font-weight:700;
  }
  .doc:hover { box-shadow:0 5px 12px rgba(150,50,110,.14); }
  .doc .cico { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff; flex-shrink:0; }

  /* Contacto */
  .cbtns { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .c-item { display:flex; align-items:center; gap:10px; font-size:12.5px; padding:10px 12px; background:#fff; border:1px solid #F0DBE7; border-radius:12px; text-decoration:none; color:var(--ink); min-width:200px; font-weight:600; }
  .c-item:hover { box-shadow:0 5px 12px rgba(150,50,110,.14); }
  .c-item .cico { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; }
  input,textarea {
    width:100%; font-family:'Quicksand',sans-serif; font-size:13px; color:var(--ink);
    padding:10px 12px; border-radius:10px; border:1px solid #E9CCDA; background:#fff; margin-bottom:10px;
  }
  input:focus,textarea:focus { outline:2px solid var(--pink2); border-color:var(--pink2); }
  label { display:block; font-size:11.5px; font-weight:700; color:#8a4a6e; margin-bottom:4px; }

  /* Lightbox */
  #lightbox {
    position:fixed; inset:0; z-index:9000; display:none; align-items:center; justify-content:center;
    background:rgba(45,20,40,.82); backdrop-filter:blur(6px); padding:30px;
  }
  #lightbox.open { display:flex; animation:lg .2s ease; }
  @keyframes lg { from { opacity:0; } }
  #lightbox img { max-width:94%; max-height:92vh; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  #lightbox .lb-close {
    position:absolute; top:22px; right:26px; width:42px; height:42px; border-radius:50%;
    background:#fff; color:var(--pink); font:700 20px/1 'Space Mono',monospace; cursor:pointer; border:0;
  }
  #lightbox .lb-nav { position:absolute; width:44px; height:44px; border-radius:50%; background:#fff; color:var(--ink); font:700 18px/1 'Space Mono',monospace; cursor:pointer; border:0; top:50%; transform:translateY(-50%); }
  #lightbox .lb-nav.prev { left:18px; } #lightbox .lb-nav.next { right:18px; }

  /* Toast */
  #toast {
    position:fixed; bottom:60px; right:16px; z-index:9500; display:none; align-items:center; gap:10px;
    background:#fff; border:1px solid var(--pink2); border-radius:12px; padding:12px 16px;
    font-size:13px; font-weight:600; color:var(--ink); box-shadow:0 12px 30px rgba(80,20,60,.25);
  }
  #toast.show { display:flex; animation:lg .2s; }

  /* Hint bar */
  #hint {
    position:fixed; bottom:58px; left:50%; transform:translateX(-50%); z-index:40;
    background:rgba(255,255,255,.75); border:1px solid #fff; color:#8a4a6e; font-size:12px; font-weight:600;
    padding:7px 16px; border-radius:20px; backdrop-filter:blur(4px); white-space:nowrap;
    animation:blink-soft 3s ease-in-out infinite; pointer-events:none;
  }
  @keyframes blink-soft { 0%,100%{opacity:.9} 50%{opacity:.45} }

  /* Modal friendly */
  @media (max-width:700px) {
    #icons { flex-direction:row; flex-wrap:wrap; width:100%; height:auto; justify-content:center; }
    #desktop { overflow:auto; }
    #windows { position:fixed; }
    .win { max-width:100vw; }
    #hint { display:none; }
  }
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot">
  <div class="logo">Niurka<b>_</b>OS</div>
  <div class="tag">ESCRITORIO DE NIURKA · ESPERE...</div>
  <div class="win-progress"><i id="bootbar"></i></div>
</div>

<!-- DESKTOP -->
<div id="desktop">

  <div id="icons"></div>

  <div id="windows"></div>

  <!-- HINT -->
  <div id="hint">💡 Doble clic en un icono para abrir · arrastra las ventanas · explora</div>

  <!-- TASKBAR -->
  <div id="taskbar">
    <button id="start-btn"><span class="fl">🪟</span> Inicio</button>
    <div id="tasks"></div>
    <div id="clock">···</div>
  </div>

  <!-- START MENU -->
  <div id="start-menu">
    <div class="sm-head"><b>Niurka Guevara</b><span>Full Stack · AI Engineer · Chiclayo</span></div>
    <div class="sm-item" data-open="about"><span class="fl">🧑‍💻</span> Sobre mí</div>
    <div class="sm-item" data-open="projects"><span class="fl">📁</span> Mis proyectos</div>
    <div class="sm-item" data-open="games"><span class="fl">🎮</span> Mi videojuego</div>
    <div class="sm-item" data-open="skills"><span class="fl">🛠️</span> Habilidades</div>

function openWin(id) {
  if (DESK.wins[id]) { focusWin(id); return; }
  const cfg = WINCFG[id];
  const el = document.createElement('div');
  el.className = 'win';
  el.id = 'win-' + id;
  el.innerHTML = `
    <div class="win-bar">
      <span class="dot"></span>
      <span class="ttl">${cfg.icon} ${cap(id)} — Niurka OS</span>
      <div class="win-btns"><button title="Minimizar" onclick="event.stopPropagation();minWin('${id}')">—</button><button title="Cerrar" onclick="event.stopPropagation();closeWin('${id}')">✕</button></div>
    </div>
    <div class="win-body">${WIN_TMPL[id]}</div>`;
  el.style.width = cfg.w + 'px';
  el.style.height = cfg.h + 'px';
  const freeX = Math.max(130, Math.min(vw2(), 240));
  el.style.left = (freeX + (Math.random()*40)) + 'px';
  el.style.top = (30 + (Math.random()*40)) + 'px';
  el.style.setProperty('--win-grad', cfg.grad);
  el.style.setProperty('--win-border', cfg.border);

  // tamaño responsive
  const vw = window.innerWidth, vh = window.innerHeight;
  if (vw < 900) { el.style.width = (vw - 20) + 'px'; el.style.left = '10px'; }
  if (vh < 640) { el.style.height = Math.min(cfg.h, vh - 120) + 'px'; el.style.top = '20px'; }

  document.getElementById('windows').appendChild(el);
  DESK.wins[id] = el;

  // taskbar
  const tb = document.createElement('button');
  tb.className = 'task-b'; tb.id = 'task-' + id; tb.dataset.win = id;
  tb.style.setProperty('--tc', cfg.iconUsed ? cfg.color : cfgIconColor(id));
  tb.innerHTML = `<span>${cfg.icon} ${cap(id)}</span>`;
  tb.onclick = () => toggleTask(id);
  document.getElementById('tasks').appendChild(tb);

  focusWin(id);
  afterOpen(id, el);
}

function cfgIconColor(id){ const m={about:'#F0E974',projects:'#f5b84a',games:'#f076b0',certs:'#3fe0b1',skills:'#5fc99e',contact:'#ff9f86',help:'#9fcfff'}; return m[id]||'#999'; }

function afterOpen(id, el) {
  if (id === 'projects') buildProjGals();
  if (id === 'games') el.querySelector('.win-body').style.display='flex';
  if (id === 'skills') animateSkills(el);
  if (id === 'certs') buildCerts();
  makeDraggable(el, el.querySelector('.win-bar'), id);
}

function cap(s){ return WINCFG[s].icon ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

function vw2(){ return window.innerWidth; }

function focusWin(id) {
  const el = DESK.wins[id]; if (!el) return;
  DESK.zTop++;
  el.style.zIndex = DESK.zTop;
  el.classList.add('top');
  Object.keys(DESK.wins).forEach(k => { if (k !== id) DESK.wins[k].classList.remove('top'); });
  document.querySelectorAll('.task-b').forEach(b => b.classList.toggle('active', b.dataset.win === id));
  // cerrar start menu
  document.getElementById('start-menu').classList.remove('open');
}

function minWin(id) {
  const el = DESK.wins[id]; if (!el) return;
  el.classList.add('minimized');
  const tb = document.getElementById('task-' + id); if (tb) tb.classList.remove('active');
}
function toggleTask(id) {
  const el = DESK.wins[id]; if (!el) return;
  if (el.classList.contains('minimized')) { el.classList.remove('minimized'); focusWin(id); }
  else if (el.classList.contains('top')) { el.classList.add('minimized'); const tb=document.getElementById('task-'+id); if(tb)tb.classList.remove('active'); }
  else focusWin(id);
}
function closeWin(id) {
  const el = DESK.wins[id]; if (!el) return;
  el.remove(); delete DESK.wins[id];
  const tb = document.getElementById('task-' + id); if (tb) tb.remove();
  if (id === 'games') toast('👋 Hasta la próxima!');
}

/* Drag */
function makeDraggable(el, bar, id) {
  let sx, sy, ox, oy, dragging = false;
  bar.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.win-btns')) return;
    focusWin(id);
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    ox = el.offsetLeft; oy = el.offsetTop;
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const nx = Math.max(0, Math.min(window.innerWidth - 60, ox + (e.clientX - sx)));
    const ny = Math.max(0, Math.min(window.innerHeight - 90, oy + (e.clientY - sy)));
    el.style.left = nx + 'px';
    el.style.top = ny + 'px';
  });
  bar.addEventListener('pointerup', () => { dragging = false; });
  bar.addEventListener('dblclick', (e) => { if (!e.target.closest('.win-btns')) minWin(id); });
}

/* ---------- Galerías proyectos ---------- */
function buildProjGals() {
  const init = { tf:'gal-tf', hc:'gal-hc', game:'gal-game' };
  Object.keys(init).forEach(k => {
    const el = document.getElementById(init[k]);
    if (!el || el.dataset.done) return;
    el.dataset.done = 1;
    el.innerHTML = GALERIES[k].map((src, i) => `<img src="${src}" alt="${k} ${i+1}" onclick="openProjGallery('${k}',${i})">`).join('');
    // drag-to-scroll
    let down=false, startX=0, sl=0;
    el.addEventListener('pointerdown', (e) => { down=true; startX=e.clientX; sl=el.scrollLeft; });
    el.addEventListener('pointermove', (e) => { if(down){ el.scrollLeft = sl - (e.clientX-startX); } });
    ['pointerup','pointerleave'].forEach(ev => el.addEventListener(ev, () => down=false));
  });
}
function openProjGallery(key, idx = 0) {
  if (!GALERIES[key]) return;
  lightboxStack = { imgs: GALERIES[key], idx };
  showLb(srcLb(lightboxStack.idx));
}

function showLb(src){ document.getElementById('lb-img').src = src; document.getElementById('lightbox').classList.add('open'); }
function closeLb(){ document.getElementById('lightbox').classList.remove('open'); }
function lbNav(d){ lightboxStack.idx = (lightboxStack.idx + d + lightboxStack.imgs.length) % lightboxStack.imgs.length; showLb(srcLb(lightboxStack.idx)); }
document.addEventListener('keydown', (e) => {
  const lb = document.getElementById('lightbox');
  if (lb.classList.contains('open')) { if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowLeft') lbNav(-1); if (e.key === 'ArrowRight') lbNav(1); }
});
document.getElementById('lightbox').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeLb(); });

/* ---------- Skills ---------- */
function animateSkills(winEl) {
  const bars = winEl.querySelectorAll('.bar i');
  setTimeout(() => bars.forEach(b => b.style.width = b.dataset.w + '%'), 150);
}

/* ---------- Certificados ---------- */
const CERT = (window.PORTFOLIO_CERTS || {});
const ALLCERTS = [...(CERT.tec||[]).map(c=>({...c,cat:'tec'})), ...(CERT.tools||[]).map(c=>({...c,cat:'tools'}))];
const CICO = { py:'linear-gradient(120deg,#FF5E8E,#FF82A9)', 'C++':'linear-gradient(120deg,#5d6db4,#8a9be0)', AI:'linear-gradient(120deg,#b48dff,#c39cff)', BE:'linear-gradient(120deg,#6fb7ff,#8fc9ff)', RH:'linear-gradient(120deg,#ff6b6b,#ff9f86)', NDG:'linear-gradient(120deg,#5fc99e,#9fe9ce)', GC:'linear-gradient(120deg,#ffc46b,#ffd99b)', Ci:'linear-gradient(120deg,#84a4d8,#a9c2ec)', IoT:'linear-gradient(120deg,#ff8a6b,#ffb073)', DB:'linear-gradient(120deg,#7fd8be,#aeeed8)', Ja:'linear-gradient(120deg,#ff9f5e,#ffc46b)', XL:'linear-gradient(120deg,#5fc99e,#9fe9ce)', RS:'linear-gradient(120deg,#ff82a9,#ff9fc0)', EN:'linear-gradient(120deg,#4ba7d8,#7fc8ec)', WA:'linear-gradient(120deg,#b48dff,#d0b2ff)', LT:'linear-gradient(120deg,#6fb7ff,#9fd0ff)', NM:'linear-gradient(120deg,#ff8ab0,#ffb1c9)' };
function buildCerts(filter = 'all') {
  const grid = document.getElementById('cert-grid');
  if (!grid) return;
  const list = ALLCERTS.filter(c => filter === 'all' || c.cat === filter);
  grid.innerHTML = list.map(c => `
    <a class="cert" href="${window.CERT_URL ? window.CERT_URL(c.id) : '#'}" target="_blank" rel="noopener">
      <span class="cico" style="background:${CICO[c.ico]||'linear-gradient(120deg,#ff82a9,#ff9fc0)'}">🏅</span>
      <div><b>${c.name}</b><span>${c.meta || ''} · ${c.desc || ''}</span></div>
    </a>`).join('');
}
document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (chip) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    chip.classList.add('on');
    buildCerts(chip.dataset.cat);
  }
});

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ---------- Start menu ---------- */
document.getElementById('start-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('start-menu').classList.toggle('open');
});
document.querySelectorAll('#start-menu .sm-item[data-open]').forEach(item => {
  item.addEventListener('click', () => { document.getElementById('start-menu').classList.remove('open'); openWin(item.dataset.open); });
});
document.getElementById('sm-refresh').addEventListener('click', () => {
  document.getElementById('start-menu').classList.remove('open');
  Object.keys(DESK.wins).forEach(closeWin);
  renderDesktop();
  toast('🔄 Escritorio reiniciado');
});
document.addEventListener('click', (e) => {
  const sm = document.getElementById('start-menu');
  if (sm.classList.contains('open') && !sm.contains(e.target) && e.target.id !== 'start-btn') sm.classList.remove('open');
});

/* ---------- Contact form ---------- */
document.addEventListener('submit', (e) => {
  if (e.target.id === 'contact-form') {
    e.preventDefault();
    const f = e.target;
    const body = `Nombre: ${f.Nombre.value}\nEmail: ${f.Email.value}\nMensaje: ${f.Mensaje.value}`;
    const mail = document.createElement('a');
    mail.href = 'mailto:maritzaguevaramarrujo@gmail.com?subject=' + encodeURIComponent('Contacto desde Niurka OS') + '&body=' + encodeURIComponent(body);
    mail.click();
    toast('💌 ¡Gracias! Se abrió tu correo con el mensaje listo.');
    f.reset();
  }
});

/* ---------- Reloj ---------- */
function tick() {
  const cl = document.getElementById('clock');
  if (cl) cl.textContent = new Date().toLocaleTimeString('es-PE', { hour:'2-digit', minute:'2-digit' });
}
/* reloj con fecha */
function tickFull(){
  const cl = document.getElementById('clock');
  if (cl) cl.textContent = new Date().toLocaleDateString('es-PE',{month:'short',day:'numeric'}) + '  ' + new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
}

/* ---------- Init ---------- */
boot();
tickFull();
setInterval(tickFull, 10000);
